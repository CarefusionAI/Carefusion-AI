# CareFusion AI - laptop dev environment (synthetic data only).
# Usage: cp .env.example .env && docker compose up -d

services:
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
      - cf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - cf-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # minio: added back in W4 (file uploads). Run `docker login` first if pull fails.
  # image: minio/minio:RELEASE.2024-10-02T17-50-41Z

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  db-migrate:
    build:
      context: ./carefusion-db
      dockerfile: Dockerfile
    command: ["sh", "-c", "sleep 3 && ./run_migrations.sh \"$$DATABASE_URL\""]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:3

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - db
      - valkey
      - keycloak

  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file: .env

volumes:
  cf-pgdata:
  cf-valkey:
