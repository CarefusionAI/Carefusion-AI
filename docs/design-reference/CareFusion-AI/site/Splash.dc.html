<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading — CareFusion AI</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/carefusion/tokens.css">
<link rel="stylesheet" href="ds/carefusion/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;family=Source+Serif+4:opsz,wght@8..60,600&amp;display=swap">
<style>
body{margin:0;background:#f3eee8;font-family:var(--font-sans)}
.cap-v{animation:capv 2.4s cubic-bezier(0.65,0,0.35,1) infinite;transform-box:fill-box;transform-origin:center}
.cap-h{animation:caph 2.4s cubic-bezier(0.65,0,0.35,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes capv{0%,100%{transform:translateY(-6px)}45%,55%{transform:translateY(0)}}
@keyframes caph{0%,100%{transform:translateX(6px)}45%,55%{transform:translateX(0)}}
.core{animation:core 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes core{0%,30%,100%{opacity:0;transform:scale(.4)}50%,70%{opacity:1;transform:scale(1)}}
.bar{animation:fill 2.6s cubic-bezier(0.65,0,0.35,1) infinite}
@keyframes fill{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion: reduce){.cap-v,.cap-h,.core,.bar{animation:none}.core{opacity:1}}
/*cf-fx:start*/
.cf-root{isolation:isolate;position:relative;--surface:rgba(243,238,232,.52);--surface-raised:rgba(250,245,239,.84);--surface-cream:rgba(239,231,222,.78)}
.cf-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.cf-root .cf-root .cf-fx{display:none}
.cf-fx-pub{--fx-o1:#86bdb8;--fx-o2:#ecd9b2;--fx-o3:#dfeaf4;--fx-a:#5e9e98;--fx-b:#d2b277}
.cf-fx-cit{--fx-o1:#cfe5d6;--fx-o2:#f3d9cd;--fx-o3:#cfe6e2;--fx-a:#5e9e98;--fx-b:#d2b277}
.cf-fx-doc{--fx-o1:#d3e2f1;--fx-o2:#cfe6e2;--fx-o3:#e3d9f0;--fx-a:#45658a;--fx-b:#86bdb8}
.cf-fx-stf{--fx-o1:#cfe6e2;--fx-o2:#d6e4f2;--fx-o3:#f3e4c6;--fx-a:#3a726d;--fx-b:#c9a86a}
.cf-fx-adm{--fx-o1:#e3d9f0;--fx-o2:#f3e4c6;--fx-o3:#d6e4f2;--fx-a:#6a5a8c;--fx-b:#c9a86a}
.fx-orb{position:absolute;border-radius:9999px;filter:blur(70px);opacity:.85;animation:fxDrift 26s ease-in-out infinite alternate}
.fx-o1{width:560px;height:560px;background:var(--fx-o1);right:-140px;top:-160px}
.fx-o2{width:480px;height:480px;background:var(--fx-o2);left:-160px;bottom:-140px;animation-duration:32s;animation-delay:-8s}
.fx-o3{width:380px;height:380px;background:var(--fx-o3);left:38%;top:30%;animation-duration:38s;animation-delay:-16s;opacity:.6}
@keyframes fxDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,40px) scale(1.08)}100%{transform:translate(40px,-30px) scale(.95)}}
.fx-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(58,114,109,.16) 1px,transparent 1.5px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 78% 18%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse 70% 60% at 78% 18%,#000 0%,transparent 70%)}
.fx-cross{position:absolute;overflow:visible}
.fx-cross .v{fill:var(--fx-a)}.fx-cross .h{fill:var(--fx-b)}
.fx-c1{width:560px;height:560px;right:-150px;bottom:-170px;opacity:.09;animation:fxSpin 90s linear infinite}
.fx-c2{width:230px;height:230px;left:5%;top:12%;opacity:.08;animation:fxFloat 14s ease-in-out infinite}
.fx-c3{width:150px;height:150px;right:30%;top:58%;opacity:.16;animation:fxFloat 18s ease-in-out -6s infinite}
.fx-c3 .v,.fx-c3 .h{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}.fx-c3 .v{stroke:var(--fx-a)}.fx-c3 .h{stroke:var(--fx-b)}
@keyframes fxSpin{to{transform:rotate(360deg)}}
@keyframes fxFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.fx-ecg{position:absolute;left:0;bottom:16%;width:100%;height:110px;opacity:.2}
.fx-ecg path{fill:none;stroke:var(--fx-a);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:420 2600;animation:fxEcg 7s linear infinite}
@keyframes fxEcg{from{stroke-dashoffset:3020}to{stroke-dashoffset:0}}
.fx-p{position:absolute;bottom:-60px;width:10px;height:26px;border-radius:9999px;background:var(--fx-a);opacity:0;animation:fxRise 22s linear infinite}
.fx-p:nth-of-type(even){background:var(--fx-b);width:22px;height:9px}
.fx-p1{left:8%;animation-delay:0s}.fx-p2{left:22%;animation-delay:-5s;animation-duration:26s}.fx-p3{left:41%;animation-delay:-11s}.fx-p4{left:57%;animation-delay:-3s;animation-duration:30s}.fx-p5{left:73%;animation-delay:-15s}.fx-p6{left:90%;animation-delay:-8s;animation-duration:24s}
@keyframes fxRise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.22}85%{opacity:.18}100%{transform:translateY(-115vh) rotate(160deg);opacity:0}}
.cf-root .box,.cf-root .cf-card,.cf-root .cf-stat,.cf-root .cf-sidebar,.cf-root .card,.cf-root .panel{-webkit-backdrop-filter:blur(12px) saturate(1.08);backdrop-filter:blur(12px) saturate(1.08)}
@media (prefers-reduced-motion: reduce){.fx-orb,.fx-cross,.fx-ecg path,.fx-p{animation:none}.fx-p{display:none}}
/*cf-fx:end*/
</style>
</helmet>
<main class="cf-root" aria-busy="true" style="position: relative; min-height: 100vh; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 48px 24px; box-sizing: border-box;"><div class="cf-fx cf-fx-pub" aria-hidden="true"><span class="fx-orb fx-o1"></span><span class="fx-orb fx-o2"></span><span class="fx-orb fx-o3"></span><span class="fx-grid"></span><svg class="fx-cross fx-c1" viewBox="0 0 64 64"><rect class="v" x="21" y="5" width="18" height="50" rx="9"></rect><rect class="h" x="9" y="25" width="50" height="18" rx="9"></rect></svg><svg class="fx-cross fx-c2" viewBox="0 0 64 64"><rect class="v" x="21" y="5" width="18" height="50" rx="9"></rect><rect class="h" x="9" y="25" width="50" height="18" rx="9"></rect></svg><svg class="fx-cross fx-c3" viewBox="0 0 64 64"><rect class="v" x="21" y="5" width="18" height="50" rx="9"></rect><rect class="h" x="9" y="25" width="50" height="18" rx="9"></rect></svg><svg class="fx-ecg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 70 H260 L280 70 L294 40 L310 100 L328 14 L348 92 L362 70 H520 L536 56 L552 70 H820 L840 70 L854 44 L870 96 L888 20 L906 88 L920 70 H1200"></path></svg><span class="fx-p fx-p1"></span><span class="fx-p fx-p2"></span><span class="fx-p fx-p3"></span><span class="fx-p fx-p4"></span><span class="fx-p fx-p5"></span><span class="fx-p fx-p6"></span></div>
  <span aria-hidden="true" style="position: absolute; width: 560px; height: 560px; border-radius: 9999px; background: var(--tint-sage); filter: blur(100px); left: 10%; top: -160px;"></span>
  <span aria-hidden="true" style="position: absolute; width: 480px; height: 480px; border-radius: 9999px; background: var(--tint-lavender); filter: blur(100px); right: 8%; bottom: -160px;"></span>
  <svg role="img" aria-label="CareFusion AI" width="132" height="132" viewBox="0 0 64 64" style="position: relative;">
    <rect class="cap-v" x="21" y="5" width="18" height="50" rx="9" fill="#5e9e98"></rect>
    <rect class="cap-h" x="9" y="25" width="50" height="18" rx="9" fill="#d2b277"></rect>
    <g class="core"><rect x="21" y="25" width="18" height="18" rx="2" fill="#3a726d"></rect><circle cx="30" cy="34" r="3.2" fill="#faf5ef"></circle></g>
  </svg>
  <div style="position: relative; text-align: center;">
    <p style="margin: 0 0 8px; font-family: var(--font-serif); font-size: 44px; line-height: 50px; font-weight: 600; color: var(--ink-strong);">CareFusion AI</p>
    <p style="margin: 0; font-size: 17px; line-height: 28px; color: var(--ink-body);">Your health, connected.</p>
  </div>
  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <div role="progressbar" aria-label="Loading" style="width: 240px; height: 4px; border-radius: 9999px; background: var(--surface-cream); overflow: hidden;"><div class="bar" style="width: 40%; height: 100%; border-radius: 9999px; background: var(--primary-soft);"></div></div>
    <p aria-live="polite" style="margin: 0; font-size: 14px; color: var(--ink-muted);">Preparing your workspace…</p>
  </div>
  <p style="position: absolute; bottom: 24px; margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--warning);">Synthetic demo data</p>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":800}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
