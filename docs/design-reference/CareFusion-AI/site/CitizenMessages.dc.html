<style>
body{margin:0;background:var(--surface);color:var(--ink-body);font-family:var(--font-sans)}
.pg{padding:32px 40px 56px;box-sizing:border-box;max-width:1240px;display:flex;flex-direction:column;gap:20px}
.lay{display:grid;grid-template-columns:340px minmax(0,1fr);gap:0;border:1px solid var(--border);border-radius:24px;overflow:hidden;background:var(--surface-raised);box-shadow:var(--shadow-card);min-height:880px}
@media (max-width: 900px){.lay{grid-template-columns:1fr}}
.inbox{border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface-raised)}
.ih{padding:18px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--border)}
.srch{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.srch input{flex:1;border:0;background:transparent;font:inherit;font-size:14px;padding:10px 0;color:var(--ink);min-width:0}
.srch:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px}
.flt{display:flex;gap:6px;flex-wrap:wrap}
.flt button{border:1px solid var(--border);background:var(--surface);border-radius:9999px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;color:var(--ink-body);cursor:pointer}
.flt button.on{background:var(--ink-strong);border-color:var(--ink-strong);color:var(--on-primary)}
.th{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px 18px;border:0;border-bottom:1px solid var(--border);background:transparent;font:inherit;text-align:left;cursor:pointer;color:inherit;transition:background 160ms ease}
.th:hover{background:var(--surface)}
.th.on{background:var(--tint-teal);box-shadow:inset 3px 0 0 var(--primary)}
.th:focus-visible,.flt button:focus-visible,.snd:focus-visible,.ib:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-2px}
.th .n{font-weight:600;color:var(--ink);font-size:14px}
.th .p{font-size:13px;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .t{font-size:11px;color:var(--ink-muted);white-space:nowrap}
.un{display:inline-flex;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:9999px;background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:700;align-items:center;justify-content:center}
.pane{display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,var(--surface) 0%,var(--surface-raised) 100%)}
.ph{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface-raised)}
.chatlog{flex:1;padding:22px;display:flex;flex-direction:column;gap:14px}
.day{align-self:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-muted);background:var(--surface-cream);padding:4px 12px;border-radius:9999px}
.msg{display:flex;gap:10px;max-width:78%;animation:pop 400ms cubic-bezier(0.22,1,0.36,1) both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:12px 16px;border-radius:18px;font-size:14px;line-height:22px;background:var(--surface-raised);border:1px solid var(--border)}
.me .bub{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.meta{font-size:11px;color:var(--ink-muted);margin-top:4px}.me .meta{text-align:right}
.att{display:flex;gap:10px;align-items:center;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--ink)}
.me .att{background:rgba(250,245,239,.16);border-color:rgba(250,245,239,.3);color:var(--on-primary)}
.comp{margin:0 16px 16px;padding:10px;border-radius:18px;background:var(--surface-raised);border:1px solid var(--border);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:8px}
.comp textarea{border:0;background:transparent;font:inherit;font-size:14px;resize:none;padding:6px 8px;color:var(--ink);min-height:44px}
.comp textarea:focus-visible{outline:2px solid var(--focus-ring);border-radius:8px}
.cr{display:flex;align-items:center;gap:6px}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--ink-muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:var(--surface-cream)}
.snd{margin-left:auto;border:0;border-radius:12px;background:var(--primary);color:var(--on-primary);font:inherit;font-weight:600;font-size:14px;padding:10px 18px;cursor:pointer}
.pend{display:flex;gap:8px;flex-wrap:wrap;padding:0 8px}
.pill{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:9999px;background:var(--tint-blue);font-size:12px;color:var(--info);font-weight:600}
.cf-srx{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.msg{animation:none}}
/*cf-fx:start*/

.cf-root .cf-root .cf-fx{display:none}
.cf-fx-pub{--fx-o1:#86bdb8;--fx-o2:#ecd9b2;--fx-o3:#dfeaf4;--fx-a:#5e9e98;--fx-b:#d2b277}
.cf-fx-cit{--fx-o1:#cfe5d6;--fx-o2:#f3d9cd;--fx-o3:#cfe6e2;--fx-a:#5e9e98;--fx-b:#d2b277}
.cf-fx-doc{--fx-o1:#d3e2f1;--fx-o2:#cfe6e2;--fx-o3:#e3d9f0;--fx-a:#45658a;--fx-b:#86bdb8}
.cf-fx-stf{--fx-o1:#cfe6e2;--fx-o2:#d6e4f2;--fx-o3:#f3e4c6;--fx-a:#3a726d;--fx-b:#c9a86a}
.cf-fx-adm{--fx-o1:#e3d9f0;--fx-o2:#f3e4c6;--fx-o3:#d6e4f2;--fx-a:#6a5a8c;--fx-b:#c9a86a}
.fx-orb{position:absolute;border-radius:9999px;filter:blur(70px);opacity:.85;animation:fxDrift 26s ease-in-out infinite alternate}
.fx-o1{width:560px;height:560px;background:var(--fx-o1);right:-140px;top:-160px}
.fx-o2{width:480px;height:480px;background:var(--fx-o2);left:-160px;bottom:-140px;animation-duration:32s;animation-delay:-8s}
.fx-o3{width:380px;height:380px;background:var(--fx-o3);left:38%;top:30%;animation-duration:38s;animation-delay:-16s;opacity:.6}
@keyframes fxDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-60px,40px) scale(1.08)}100%{transform:translate(40px,-30px) scale(.95)}}
.fx-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(58,114,109,.16) 1px,transparent 1.5px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 78% 18%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse 70% 60% at 78% 18%,#000 0%,transparent 70%)}
.fx-cross{position:absolute;overflow:visible}
.fx-cross .v{fill:var(--fx-a)}.fx-cross .h{fill:var(--fx-b)}
.fx-c1{width:560px;height:560px;right:-150px;bottom:-170px;opacity:.09;animation:fxSpin 90s linear infinite}
.fx-c2{width:230px;height:230px;left:5%;top:12%;opacity:.08;animation:fxFloat 14s ease-in-out infinite}
.fx-c3{width:150px;height:150px;right:30%;top:58%;opacity:.16;animation:fxFloat 18s ease-in-out -6s infinite}
.fx-c3 .v,.fx-c3 .h{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}.fx-c3 .v{stroke:var(--fx-a)}.fx-c3 .h{stroke:var(--fx-b)}
@keyframes fxSpin{to{transform:rotate(360deg)}}
@keyframes fxFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.fx-ecg{position:absolute;left:0;bottom:16%;width:100%;height:110px;opacity:.2}
.fx-ecg path{fill:none;stroke:var(--fx-a);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:420 2600;animation:fxEcg 7s linear infinite}
@keyframes fxEcg{from{stroke-dashoffset:3020}to{stroke-dashoffset:0}}
.fx-p{position:absolute;bottom:-60px;width:10px;height:26px;border-radius:9999px;background:var(--fx-a);opacity:0;animation:fxRise 22s linear infinite}
.fx-p:nth-of-type(even){background:var(--fx-b);width:22px;height:9px}
.fx-p1{left:8%;animation-delay:0s}.fx-p2{left:22%;animation-delay:-5s;animation-duration:26s}.fx-p3{left:41%;animation-delay:-11s}.fx-p4{left:57%;animation-delay:-3s;animation-duration:30s}.fx-p5{left:73%;animation-delay:-15s}.fx-p6{left:90%;animation-delay:-8s;animation-duration:24s}
@keyframes fxRise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.22}85%{opacity:.18}100%{transform:translateY(-115vh) rotate(160deg);opacity:0}}
.cf-root .box,.cf-root .cf-card,.cf-root .cf-stat,.cf-root .cf-sidebar,.cf-root .card,.cf-root .panel{-webkit-backdrop-filter:blur(12px) saturate(1.08);backdrop-filter:blur(12px) saturate(1.08)}
@media (prefers-reduced-motion: reduce){.fx-orb,.fx-cross,.fx-ecg path,.fx-p{animation:none}.fx-p{display:none}}
/*cf-fx:end*/

    <nav class="inbox" aria-label="Conversations">
      <div class="ih">
        <div class="srch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14zM21 21l-5-5"></path></svg><label for="m-s" class="cf-srx">Search messages</label><input id="m-s" placeholder="Search messages"></div>
        <div class="flt" role="group" aria-label="Filter"><sc-for list="{{filters}}" as="f" hint-placeholder-count="4"><button type="button" class="{{f.cls}}" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
      </div>
      <sc-for list="{{threads}}" as="t" hint-placeholder-count="6">
        <button type="button" class="{{t.cls}}" aria-current="{{t.cur}}" onClick="{{t.open}}">
          <x-import component-from-global-scope="CareFusion.Avatar" name="{{t.name}}" size="{{n40}}" tone="{{t.tone}}"></x-import>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;"><span style="display: flex; justify-content: space-between; gap: 8px;"><span class="n">{{t.name}}</span><span class="t">{{t.time}}</span></span><span class="muted" style="font-size: 12px;">{{t.role}}</span><span style="display: flex; gap: 8px; align-items: center;"><span class="p" style="flex: 1;">{{t.prev}}</span><sc-if value="{{t.unread}}" hint-placeholder-val="false"><span class="un" aria-label="{{t.unreadLabel}}">{{t.unread}}</span></sc-if></span></span>
        </button>
      </sc-for>
    </nav>

    <section class="pane" aria-label="{{cur.name}}">
      <div class="ph">
        <x-import component-from-global-scope="CareFusion.Avatar" name="{{cur.name}}" size="{{n44}}" tone="{{cur.tone}}"></x-import>
        <div style="flex: 1; min-width: 0;"><strong style="color: var(--ink);">{{cur.name}}</strong><div class="muted">{{cur.role}}</div></div>
        <x-import component-from-global-scope="CareFusion.Badge" tone="success" dot="{{yes}}">End-to-end encrypted</x-import>
        <x-import component-from-global-scope="CareFusion.Button" variant="secondary" size="sm" on-click="{{toCare}}">Book visit</x-import>
      </div>
      <div class="chatlog" aria-live="polite">
        <span class="day">Thursday, 15 October</span>
        <sc-for list="{{cur.msgs}}" as="m" hint-placeholder-count="5">
          <div class="{{m.cls}}">
            <div>
              <div class="bub">{{m.text}}
                <sc-if value="{{m.file}}" hint-placeholder-val="false"><div class="att"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v4h4"></path></svg><span style="flex: 1; font-size: 13px; font-weight: 600;">{{m.file}}</span><span style="font-size: 12px; opacity: .8;">{{m.size}}</span></div></sc-if>
              </div>
              <div class="meta">{{m.meta}}</div>
            </div>
          </div>
        </sc-for>
      </div>
      <form class="comp" onSubmit="{{send}}">
        <label for="m-in" class="cf-srx">Write a message</label>
        <textarea id="m-in" rows="2" placeholder="{{cur.ph}}" value="{{draft}}" onChange="{{type}}"></textarea>

        <div class="cr">
          <button type="button" class="ib" aria-label="Attach from my documents" onClick="{{addAtt}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 11l-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7"></path></svg></button>
          <button type="button" class="ib" aria-label="Add a photo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M8 14l3-3l2 2l3-4"></path></svg></button>
          <span class="muted" style="font-size: 12px;">Attachments go into your Documents too</span>
          <button type="submit" class="snd">Send</button>
        </div>
      </form>
    </section>
  </div>
</div>

    var inbound = this.state.bus.filter(function (e) { return e.type === 'message' && e.from === 'doctor'; }).reverse();
    if (inbound.length) {
      T[0] = Object.assign({}, T[0], { time: inbound[inbound.length - 1].at, unread: T[0].unread + inbound.length, msgs: T[0].msgs.concat(inbound.map(function (e) { return ['them', e.text, '', '', 'Dr. Arun Nair · ' + e.at + ' · from Doctor app']; })) });
    }
    var f = this.state.filter;
    var idx = this.state.open;
    var cur = T[idx];
    var extra = this.state.extra[idx] || [];
    var all = cur.msgs.map(function (m) { return { cls: m[0] === 'me' ? 'msg me' : 'msg', text: m[1], file: m[2], size: m[3], meta: m[4] }; }).concat(extra);
    return {
      yes: true, n40: 40, n44: 44,
      draft: this.state.draft, hasAtt: this.state.att,
      filters: ['All', 'Doctors', 'Hospitals', 'Labs'].map((l) => ({ label: l, cls: f === l ? 'on' : '', pressed: f === l ? 'true' : 'false', pick: () => this.setState({ filter: l }) })),
      threads: T.map((t, i) => ({ t: t, i: i })).filter(function (x) { return f === 'All' || x.t.kind === f; }).map((x) => ({
        name: x.t.name, role: x.t.role, tone: x.t.tone, time: x.t.time,
        prev: x.t.msgs[x.t.msgs.length - 1][1], unread: x.i === idx ? 0 : x.t.unread, unreadLabel: x.t.unread + ' unread',
        cls: x.i === idx ? 'th on' : 'th', cur: x.i === idx ? 'true' : 'false',
        open: () => this.setState({ open: x.i, draft: '' })
      })),
      cur: { name: cur.name, ph: "Write to " + cur.name + "…", role: cur.role, tone: cur.tone, msgs: all },
      type: (e) => this.setState({ draft: e.target.value }),
      addAtt: () => this.setState({ att: true }),
      dropAtt: () => this.setState({ att: false }),
      send: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!this.state.draft.trim() && !this.state.att) return;
        var ex = Object.assign({}, this.state.extra);
        ex[idx] = (ex[idx] || []).concat([{ cls: 'msg me', text: this.state.draft.trim() || 'Sharing my BP log.', file: this.state.att ? 'BP log, Oct.pdf' : '', size: this.state.att ? '84 KB' : '', meta: 'You · just now · Sent' }]);
        if (cur.kind === 'Doctors') busPush({ type: 'message', from: 'citizen', to: ['doctor'], title: 'Message from Anjali Menon', text: (this.state.draft.trim() || 'Sharing my BP log.') + (this.state.att ? ' · BP log, Oct.pdf' : ''), href: 'CitizenMessages.dc.html' });
        this.setState({ extra: ex, draft: '', att: false });
      },
      toCare: () => { if (this.props.go) this.props.go('care'); }
    };
  }
}
</script>
